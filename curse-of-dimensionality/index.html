<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Curse of Dimensionality</title>
  <link rel="icon" type="image/png" href="styles/favicon.png">
  <link rel="stylesheet" href="/performance/styles/reset.css">
  <link rel="stylesheet" href="/performance/styles/styles.css">
</head>
<body class="archived" style="background-color: white;">
  <a href="/#open" class="logo"></a>
  <div class="art_container short">
    <iframe 
      class="art"
      data-src="" 
      allow="camera; microphone; fullscreen; autoplay">
    </iframe>
  </div>
  
  <script>
    (function() {
      var iframe = document.querySelector('iframe.art');
      if (!iframe) return;
      var url = iframe.getAttribute('data-src');
      if (!url) return;
      function setSrc() {
        requestAnimationFrame(function() {
          requestAnimationFrame(function() {
            iframe.src = url;
          });
        });
      }
      if (document.readyState === 'complete') {
        setSrc();
      } else {
        window.addEventListener('load', setSrc, { once: true });
      }
    })();
  </script>
  
  <script type="module" src="/performance/scripts/project_info.js"></script>
  
</body>
</html>
